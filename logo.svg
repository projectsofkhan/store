<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="512" height="512" role="img" aria-label="Store">
  <defs>
    <!-- Soft inner shadow for depth -->
    <radialGradient id="glow" cx="50%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#b87333" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#a0522d" stop-opacity="0"/>
    </radialGradient>

    <!-- Subtle top sheen -->
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Rounded tile background -->
  <rect x="0" y="0" width="128" height="128" rx="28" fill="#a0522d"/>
  <rect x="0" y="0" width="128" height="128" rx="28" fill="url(#glow)"/>
  <rect x="0" y="0" width="128" height="128" rx="28" fill="url(#sheen)"/>

  <!-- Inner highlight border -->
  <rect x="4" y="4" width="120" height="120" rx="24" fill="none" stroke="#ffffff" stroke-opacity="0.14" stroke-width="1.5"/>

  <!-- Shopping bag body -->
  <g transform="translate(64 68)">
    <path d="M -30 -22 L -34 -14 L -34 22 a 6 6 0 0 0 6 6 L 28 28 a 6 6 0 0 0 6 -6 L 34 -14 L 30 -22 Z"
          fill="none" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>

    <!-- Bag top line -->
    <line x1="-34" y1="-14" x2="34" y2="-14" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>

    <!-- Bag handle (semicircle) -->
    <path d="M -16 -22 a 16 16 0 0 1 32 0"
          fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>

    <!-- "S" monogram inside bag -->
    <text x="0" y="12" text-anchor="middle"
          font-family="'Google Sans', 'Inter', -apple-system, sans-serif"
          font-size="30" font-weight="700" fill="#ffffff"
          letter-spacing="-1">S</text>
  </g>
</svg>